<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA3E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B68EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B88FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8754A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F08060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48C774;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60D48A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A5080;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000033"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="520" fill="#F5F7FA" rx="16"/>

  <!-- Title -->
  <text x="200" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E6B">Architecture HOTELIA</text>

  <!-- Layer 1: JSP -->
  <rect x="60" y="58" width="280" height="54" rx="10" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="200" y="79" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="white">Page Web</text>
  <text x="200" y="99" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#D0EAFF">JSP</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="112" x2="200" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Servlet -->
  <rect x="60" y="132" width="280" height="54" rx="10" fill="url(#g2)" filter="url(#shadow)"/>
  <text x="200" y="153" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="white">Contrôleur</text>
  <text x="200" y="173" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#E0DAFF">Servlet</text>

  <!-- Arrow 2 -->
  <line x1="200" y1="186" x2="200" y2="204" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Service -->
  <rect x="60" y="206" width="280" height="54" rx="10" fill="url(#g3)" filter="url(#shadow)"/>
  <text x="200" y="227" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="white">Service</text>
  <text x="200" y="247" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#FFE0D8">Logique métier</text>

  <!-- Arrow 3 -->
  <line x1="200" y1="260" x2="200" y2="278" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: DAO + JPA -->
  <rect x="60" y="280" width="280" height="54" rx="10" fill="url(#g4)" filter="url(#shadow)"/>
  <text x="200" y="301" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="white">DAO + JPA</text>
  <text x="200" y="321" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#D0FFE8">Accès aux données</text>

  <!-- Arrow 4 -->
  <line x1="200" y1="334" x2="200" y2="352" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: Database -->
  <rect x="60" y="354" width="280" height="54" rx="10" fill="url(#g5)" filter="url(#shadow)"/>
  <!-- DB cylinder icon -->
  <ellipse cx="105" cy="374" rx="18" ry="6" fill="#5A7AAA"/>
  <rect x="87" y="374" width="36" height="20" fill="#4A6A9A"/>
  <ellipse cx="105" cy="394" rx="18" ry="6" fill="#6A8ABB"/>
  <text x="210" y="385" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="white">Base de données</text>

  <!-- Bottom note -->
  <text x="200" y="435" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#999">Architecture en couches · Jakarta EE + JPA</text>
</svg>
